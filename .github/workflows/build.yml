# Deactivated as a push/tag workflow: releases only need the AUv3, and
# `.github/workflows/auv3.yml` builds its own universal CLAP. This workflow
# stays for manual multi-platform VST3/CLAP builds via the Actions tab.
name: Build Plugin Binaries

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # GitHub's default sh on Linux does not support the array syntax below.
    shell: bash

jobs:
  package:
    name: Package plugin binaries
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-22.04
            os: ubuntu-22.04
            cross-target: ""
          - name: macos-universal
            os: macos-latest
            cross-target: x86_64-apple-darwin
          - name: windows
            os: windows-latest
            cross-target: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libgl-dev \
            libjack-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-dri2-0-dev \
            libxcb-icccm4-dev \
            libxcursor-dev \
            libxkbcommon-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Cache Cargo registry
        if: startsWith(matrix.os, 'windows')
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ matrix.name }}-${{ matrix.cross-target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ matrix.name }}-${{ matrix.cross-target }}-

      - name: Cache Cargo registry and target
        if: "!startsWith(matrix.os, 'windows')"
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.name }}-${{ matrix.cross-target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ matrix.name }}-${{ matrix.cross-target }}-

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          # The universal macOS bundle is built from x86_64 and AArch64 artifacts.
          targets: ${{ matrix.cross-target }}

      - name: Clean previous plugin bundles
        run: rm -rf target/bundled

      - name: Package all targets from bundler.toml
        run: |
          package_args=()
          for package in $(cargo xtask known-packages); do
            package_args+=("-p" "$package")
          done

          runner_name=${{ matrix.name }}
          if [[ $runner_name = "macos-universal" ]]; then
            export MACOSX_DEPLOYMENT_TARGET=10.13
            cargo xtask bundle-universal "${package_args[@]}" --release
          else
            cross_target=${{ matrix.cross-target }}
            if [[ -n $cross_target ]]; then
              package_args+=("--target" "$cross_target")
            fi

            cargo xtask bundle "${package_args[@]}" --release
          fi

      - name: Determine archive name
        run: |
          echo "ARCHIVE_NAME=polarity-sc-dark-$(date -u +"%Y-%m-%d-%H%M%S")-${{ matrix.name }}" >> "$GITHUB_ENV"

      - name: Stage packaged plugin artifacts
        run: |
          mkdir -p "$ARCHIVE_NAME/$ARCHIVE_NAME"
          mv target/bundled/* "$ARCHIVE_NAME/$ARCHIVE_NAME"

      - name: Add installation README
        run: cp ".github/workflows/readme-${{ runner.os }}.txt" "$ARCHIVE_NAME/$ARCHIVE_NAME/README.txt"

      - name: Upload packaged plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_NAME }}

  publish-release:
    # Tag-triggered GitHub Release with the unsigned build archives.
    name: Attach archives to release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all packaged archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: polarity-sc-dark-*
          merge-multiple: true

      - name: Zip each platform archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          # download-artifact loses Unix file permissions; restore exec bits
          # (standalone executables become unlaunchable otherwise).
          find . -path '*/Contents/MacOS/*' -type f -exec chmod +x {} +
          for artifact_dir in */; do
            stem="${artifact_dir%/}"
            zip -qr "Polarity-SC-Dark-${TAG}-${stem}.zip" "${stem}"
          done
          ls -l *.zip

      - name: Create or reuse the tag release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Both this workflow and auv3.yml may reach the release first; make
          # the creation step idempotent rather than racing on last write.
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
              --title "Polarity-SC-Dark $TAG" \
              --notes "Unsigned build. See README.md: trust the macOS builds with System Settings > Privacy & Security > Open Anyway, or xattr -dr com.apple.quarantine <path>."

      - name: Upload archive assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" dist/*.zip --clobber
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --latest
