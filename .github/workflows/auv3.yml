name: auv3
on:
  workflow_dispatch:
  push:
    tags: ["*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  auv3-macos:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # nih_plug_xtask writes all bundles to `<target-dir>/bundled/` (bundle_home()),
      # regardless of --target, so per-target `cargo xtask bundle --target ...` runs would
      # clobber each other. `bundle-universal` builds both Apple triples and lipo-merges
      # them into a single universal `target/bundled/Resname-Spectral-Compressor.clap`.
      - name: Build universal CLAP
        run: cargo xtask bundle-universal polarity_sc_dark --release

      - name: Configure (Xcode generator)
        run: >
          cmake -S auv3 -B build -G Xcode
          -DCLAP_WRAPPER_DOWNLOAD_DEPENDENCIES=ON
          -DCMAKE_CXX_STANDARD=17
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DPOLARITY_CLAP_LOCATION="$PWD/target/bundled/Resname-Spectral-Compressor.clap"

      # Only the two wrapper targets are built. Never `-alltargets`: the top-level
      # clap-wrapper "clapasvst3" VST3 wrapper target (top_level_default.cmake) must not
      # be built, and the project files live under build/*.xcodeproj whose name is the
      # source directory name.
      - name: Build appex + standalone
        run: |
          xcodebuild -project "$(ls -d build/*.xcodeproj | sed -n '1p')" -configuration Release -jobs 4 \
            -target polarity_sc_dark_as_auv3 \
            -target polarity_sc_dark_as_auv3_standalone

      - name: Stage and upload
        run: |
          set -euo pipefail
          mkdir -p stage
          # The real signed appex (with Info.plist + Mach-O) may live either as the
          # auv3 target product or inside the standalone app's PlugIns; the
          # un-plist'd directory clap-wrapper keeps at build top level is only
          # its embedded-CLAP staging area, so require Contents/Info.plist.
          appex="$(find build -maxdepth 5 -type d -name 'Resname-Spectral-Compressor.appex' \
                     -exec test -e '{}/Contents/Info.plist' ';' -print | sed -n '1p')"
          app="$(find build -maxdepth 3 -type d -name 'Resname Spectral Compressor AUv3.app' | sed -n '1p')"
          for f in "$appex" "$app"; do
            [ -n "$f" ] && [ -e "$f" ] || { echo "missing build product: '$f'" >&2; ls -R build >&2; exit 1; }
          done
          # The CLAP is only an intermediate build input for the wrapper targets; it is
          # not shipped in releases (releases are the .app and the .appex). Lipo-verify
          # its Mach-O anyway as a build sanity check.
          lipo -info target/bundled/Resname-Spectral-Compressor.clap/Contents/MacOS/Resname-Spectral-Compressor
          ditto "$appex" stage/Resname-Spectral-Compressor.appex
          ditto "$app" "stage/Resname Spectral Compressor AUv3.app"
      - uses: actions/upload-artifact@v4
        with:
          name: auv3-macos
          path: stage

  publish-release:
    # Tag-triggered: attach the AUv3 standalone app + appex as two separate
    # .dmg containers (no combined .zip, no CLAP) to the GitHub Release the
    # build.yml publish-release job creates (creation is idempotent there).
    # hdiutil only exists on macOS, so this runs on a macos runner.
    name: Attach AUv3 to release
    if: startsWith(github.ref, 'refs/tags/')
    needs: auv3-macos
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download the auv3 artifact
        uses: actions/download-artifact@v4
        with:
          name: auv3-macos
          path: dist

      - name: Build the release .dmgs
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          # download-artifact loses Unix file permissions (all files 644);
          # launchd refuses to spawn the app with a non-executable main
          # binary (NSPOSIXErrorDomain 111). Restore the exec bit on every
          # Mach-O under Contents/MacOS before imaging.
          find . -path '*/Contents/MacOS/*' -type f -exec chmod +x {} +
          APP_DMG="Resname-Spectral-Compressor-${TAG}-standalone.dmg"
          APPEX_DMG="Resname-Spectral-Compressor-${TAG}-appex.dmg"
          hdiutil create -ov -volname "Resname Spectral Compressor" -srcfolder "Resname Spectral Compressor AUv3.app" -format UDZO "$APP_DMG"
          hdiutil create -ov -volname "Resname Spectral Compressor" -srcfolder "Resname-Spectral-Compressor.appex" -format UDZO "$APPEX_DMG"
          ls -l "$APP_DMG" "$APPEX_DMG"

      - name: Create or reuse the tag release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
              --title "Resname Spectral Compressor $TAG" \
              --notes "Unsigned build. See README.md: trust the macOS builds with System Settings > Privacy & Security > Open Anyway, or xattr -dr com.apple.quarantine <path>."

      - name: Upload the auv3 assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" \
            "dist/Resname-Spectral-Compressor-${TAG}-standalone.dmg" \
            "dist/Resname-Spectral-Compressor-${TAG}-appex.dmg" \
            --clobber
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --latest