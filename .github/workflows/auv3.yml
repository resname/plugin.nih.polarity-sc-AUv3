name: auv3
on:
  workflow_dispatch:
  push:
    branches: [master, worktree-auv3-clap-wrapper]
    paths:
      - 'plugin/**'
      - 'framework/**'
      - 'auv3/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'bundler.toml'
      - '.github/workflows/auv3.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  auv3-macos:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # nih_plug_xtask writes all bundles to `<target-dir>/bundled/` (bundle_home()),
      # regardless of --target, so per-target `cargo xtask bundle --target ...` runs would
      # clobber each other. `bundle-universal` builds both Apple triples and lipo-merges
      # them into a single universal `target/bundled/Polarity-SC-Dark.clap`.
      - name: Build universal CLAP
        run: cargo xtask bundle-universal polarity_sc_dark --release

      - name: Configure (Xcode generator)
        run: >
          cmake -S auv3 -B build -G Xcode
          -DCLAP_WRAPPER_DOWNLOAD_DEPENDENCIES=ON
          -DCMAKE_CXX_STANDARD=17
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DPOLARITY_CLAP_LOCATION="$PWD/target/bundled/Polarity-SC-Dark.clap"

      # Only the two wrapper targets are built. Never `-alltargets`: the top-level
      # clap-wrapper "clapasvst3" VST3 wrapper target (top_level_default.cmake) must not
      # be built, and the project files live under build/*.xcodeproj whose name is the
      # source directory name.
      - name: Build appex + standalone
        run: |
          xcodebuild -project "$(ls -d build/*.xcodeproj | head -1)" -configuration Release -jobs 4 \
            -target polarity_sc_dark_as_auv3 \
            -target polarity_sc_dark_as_auv3_standalone

      - name: Stage and upload
        run: |
          set -euo pipefail
          mkdir -p stage
          appex="$(find build -maxdepth 3 -name 'Polarity-SC-Dark.appex' -not -path '*/PlugIns/*' | head -1)"
          app="$(find build -maxdepth 3 -type d -name 'Polarity-SC-Dark AUv3.app' | head -1)"
          clap="target/bundled/Polarity-SC-Dark.clap"
          for f in "$appex" "$app" "$clap"; do
            [ -n "$f" ] && [ -e "$f" ] || { echo "missing build product: '$f'" >&2; ls -R build >&2; exit 1; }
          done
          lipo -info "$clap/Contents/MacOS/Polarity-SC-Dark"
          ditto "$appex" stage/Polarity-SC-Dark.appex
          ditto "$app" "stage/Polarity-SC-Dark AUv3.app"
          ditto "$clap" "stage/Polarity-SC-Dark.clap"
      - uses: actions/upload-artifact@v4
        with:
          name: auv3-macos
          path: stage