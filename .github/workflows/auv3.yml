name: auv3
on:
  workflow_dispatch:
  push:
    tags: ["*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  auv3-macos:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # nih_plug_xtask writes all bundles to `<target-dir>/bundled/` (bundle_home()),
      # regardless of --target, so per-target `cargo xtask bundle --target ...` runs would
      # clobber each other. `bundle-universal` builds both Apple triples and lipo-merges
      # them into a single universal `target/bundled/Polarity-SC-Dark.clap`.
      - name: Build universal CLAP
        run: cargo xtask bundle-universal polarity_sc_dark --release

      - name: Configure (Xcode generator)
        run: >
          cmake -S auv3 -B build -G Xcode
          -DCLAP_WRAPPER_DOWNLOAD_DEPENDENCIES=ON
          -DCMAKE_CXX_STANDARD=17
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DPOLARITY_CLAP_LOCATION="$PWD/target/bundled/Polarity-SC-Dark.clap"

      # Only the two wrapper targets are built. Never `-alltargets`: the top-level
      # clap-wrapper "clapasvst3" VST3 wrapper target (top_level_default.cmake) must not
      # be built, and the project files live under build/*.xcodeproj whose name is the
      # source directory name.
      - name: Build appex + standalone
        run: |
          xcodebuild -project "$(ls -d build/*.xcodeproj | sed -n '1p')" -configuration Release -jobs 4 \
            -target polarity_sc_dark_as_auv3 \
            -target polarity_sc_dark_as_auv3_standalone

      - name: Stage and upload
        run: |
          set -euo pipefail
          mkdir -p stage
          # The real signed appex (with Info.plist + Mach-O) may live either as the
          # auv3 target product or inside the standalone app's PlugIns; the
          # un-plist'd directory clap-wrapper keeps at build top level is only
          # its embedded-CLAP staging area, so require Contents/Info.plist.
          appex="$(find build -maxdepth 5 -type d -name 'Polarity-SC-Dark.appex' \
                     -exec test -e '{}/Contents/Info.plist' ';' -print | sed -n '1p')"
          app="$(find build -maxdepth 3 -type d -name 'Polarity-SC-Dark AUv3.app' | sed -n '1p')"
          clap="target/bundled/Polarity-SC-Dark.clap"
          for f in "$appex" "$app" "$clap"; do
            [ -n "$f" ] && [ -e "$f" ] || { echo "missing build product: '$f'" >&2; ls -R build >&2; exit 1; }
          done
          lipo -info "$clap/Contents/MacOS/Polarity-SC-Dark"
          ditto "$appex" stage/Polarity-SC-Dark.appex
          ditto "$app" "stage/Polarity-SC-Dark AUv3.app"
          ditto "$clap" "stage/Polarity-SC-Dark.clap"
      - uses: actions/upload-artifact@v4
        with:
          name: auv3-macos
          path: stage

  publish-release:
    # Tag-triggered: attach the AUv3 app + appex + CLAP to the GitHub Release
    # the build.yml publish-release job creates (creation is idempotent there).
    name: Attach AUv3 to release
    if: startsWith(github.ref, 'refs/tags/')
    needs: auv3-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download the auv3 artifact
        uses: actions/download-artifact@v4
        with:
          name: auv3-macos
          path: dist

      - name: Zip the auv3 artifact
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          # download-artifact loses Unix file permissions (all files 644);
          # launchd refuses to spawn the app with a non-executable main
          # binary (NSPOSIXErrorDomain 111). Restore the exec bit on every
          # Mach-O under Contents/MacOS before zipping.
          find . -path '*/Contents/MacOS/*' -type f -exec chmod +x {} +
          ASSET="Polarity-SC-Dark-${TAG}-macos-auv3.zip"
          zip -qr "$ASSET" Polarity-SC-Dark.appex "Polarity-SC-Dark AUv3.app" Polarity-SC-Dark.clap
          ls -l "$ASSET"

      - name: Create or reuse the tag release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
              --title "Polarity-SC-Dark $TAG" \
              --notes "Unsigned build. See README.md: trust the macOS builds with System Settings > Privacy & Security > Open Anyway, or xattr -dr com.apple.quarantine <path>."

      - name: Upload the auv3 asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" "dist/Polarity-SC-Dark-${TAG}-macos-auv3.zip" --clobber
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --latest